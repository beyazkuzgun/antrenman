<!doctype html><meta charset="utf-8"><body><pre id=o></pre><script>
/* Uçtan uca duman testi: sahte hesapla giriş → N1 bitir → zorluk → fotoğraf → galeri → sil → çıkış. tools/test.sh çalıştırır. */
localStorage.clear(); localStorage.setItem('T_UID','u1');
const f=document.createElement('iframe');f.style.cssText='width:390px;height:844px';f.src='/t_index.html';document.body.appendChild(f);
const out=[];const ok=(c,t)=>out.push((c?'OK   ':'FAIL ')+t);const w=ms=>new Promise(r=>setTimeout(r,ms));let once=0;
const vis=(d,s)=>getComputedStyle(d.querySelector(s)).display!=='none';
f.onload=async()=>{if(once++)return;try{const d=f.contentDocument,$=id=>d.getElementById(id),q=s=>d.querySelector(s);
 await w(300); ok(vis(d,'#gate')&&!vis(d,'.wrap'),'giriş ekranı açılışta, içerik gizli');
 $('glogin').click(); await w(300); ok(!vis(d,'#gate')&&!$('who').hidden,'girişten sonra profil seçimi');
 q('#whob button[data-p=nur]').click(); await w(200);
 $('go').click(); await w(50); ok(d.documentElement.classList.contains('run')&&getComputedStyle($('tabs')).display==='none','antrenman sürerken gün seçimi gizli');
 ok($('ph').textContent==='Hazırlan'&&$('tl').textContent==='hazırlan','süreli hareketten önce hazırlık: '+$('ph').textContent+' '+$('tv').textContent);
 let ez=0;for(let k=0;k<300&&$('ph').textContent!=='Bitti';k++){ if(!ez&&/lunge/.test($('nm').textContent)){ ok(!$('ez').hidden,'Kolaylaştır düğmesi görünüyor'); $('ez').click(); await w(20); ez=1; ok(/Glute bridge/.test($('nm').textContent),'Kolaylaştır: '+$('nm').textContent) } if(!$('ask').hidden) q('#askb button').click(); else $('go').click(); await w(2) }
 ok(!$('after').hidden&&d.querySelectorAll('#fbl li').length>0,'antrenman sonu kartı');
 ok(/^Sıradaki: N2/.test($('go').textContent)&&$('sk').hidden,'bitince sıradaki gün düğmesi: '+$('go').textContent);
 ok(!$('cele').hidden&&/İlk antrenman/.test($('celet').textContent),'ilk antrenman kutlaması: '+$('celet').textContent);
 q('#pn button[data-n="3"]').click(); await w(50); ok(/rahatsızlık 3\/10/.test($('log').textContent),'rahatsızlık kaydı');
 const before=q('#fbl li[data-id=squat] small').textContent; q('#fbl li[data-id=squat] button[data-d="1"]').click(); await w(50);
 ok(q('#fbl li[data-id=squat] small').textContent!==before,'Kolay seçince sonraki sayı değişiyor ('+before+' → '+q('#fbl li[data-id=squat] small').textContent+')');
 const c=document.createElement('canvas');c.width=2000;c.height=2600;const x=c.getContext('2d');for(let i=0;i<2600;i+=40){x.fillStyle='hsl('+i%360+',70%,50%)';x.fillRect(0,i,2000,40)}
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));const dt=new f.contentWindow.DataTransfer();dt.items.add(new f.contentWindow.File([blob],'a.jpg',{type:'image/jpeg'}));
 $('phin').files=dt.files;$('phin').dispatchEvent(new Event('change'));await w(2000); ok(!$('phprev').hidden,'fotoğraf önizleme');
 $('phsave').click(); await w(300); ok(/kaydedildi/.test($('phmsg').textContent),'fotoğraf kaydı: '+$('phmsg').textContent+' boyut='+f.contentWindow.T_SIZES);
 q('#tabbar button[data-v=ilerleme]').click(); await w(300); ok(d.querySelectorAll('#gal button').length===1,'galeride 1 fotoğraf');
 ok(d.querySelectorAll('#heat i').length===91&&d.querySelectorAll('#heat i.c1,#heat i.c2').length===1,'ısı haritası: 91 gün, 1 dolu');
 ok(!$('painw').hidden&&d.querySelectorAll('#ach div.on').length===1,'rahatsızlık grafiği ve 1 rozet');
 q('#gal button').click(); await w(200); $('pvdel').click(); $('pvdel').click(); await w(300); ok(d.querySelectorAll('#gal button').length===0,'fotoğraf silindi');
 q('#tabbar button[data-v=hareketler]').click(); await w(50); q('#lib button').click(); await w(100); ok(!$('lx').hidden&&!$('lxfig').innerHTML.indexOf('<')&&vis(d,'[data-v=hareketler]'),'hareket kartı yerinde açılıyor: '+$('lxn').textContent); $('lxx').click();
 q('#tabbar button[data-v=beslenme]').click(); await w(100); ok(vis(d,'[data-v=beslenme]')&&/Koçu kur/.test($('nut').textContent),'beslenme sekmesi ve kurulum mesajı');
 $('pkg').value='70';$('pcm').value='178';$('page').value='25';$('pgoal').value='kas'; q('[data-a=psave]').click(); await w(100);
 ok(/Günlük hedef: \d+ kcal, \d+ g protein/.test($('nut').textContent.replace(/\s+/g,' ')),'hedef hesaplandı: '+($('nut').textContent.match(/Günlük hedef: [^.]*/)||[''])[0]);
 q('[data-a=add][data-f=egg]').click(); await w(50); q('[data-a=add][data-f=egg]').click(); await w(50); ok(/Yumurta ×2/.test($('nut').textContent),'yiyecek ekleme: 2 yumurta');
 q('[data-a="wa+"]').click(); await w(30); const sl=q('[data-a=sl]'); sl.value='6'; sl.dispatchEvent(new Event('change',{bubbles:true})); await w(50);
 ok(q('[data-a=sl]').value==='6'&&d.querySelectorAll('.nrow').length===4,'su ve uyku girişi');
 ok(d.querySelectorAll('#nut .cm').length>0&&!/Koçu kur/.test($('nut').textContent),'koç önerileri: '+(q('#nut .cm')||{}).textContent);
 const st=JSON.parse(f.contentWindow.localStorage.getItem('antrenman.v2.nur')); ok(st.nut&&st.nut.prof.kg===70&&Object.keys(st.nut.days).length===1,'beslenme kaydı saklandı');
 q('#tabbar button[data-v=antrenman]').click(); await w(50); ok(!$('coachb').hidden&&$('coacht').textContent.length>5,'antrenman sekmesinde koç kartı: '+$('coacht').textContent.slice(0,60));
 q('#tabbar button[data-v=antrenman]').click(); $('go').click(); await w(50); q('#qk').click(); await w(50); ok(/kısa/.test($('dt').textContent),'Vaktim az: '+$('dt').textContent);
 q('#tabbar button[data-v=ayarlar]').click(); $('aclogout').click(); await w(300); ok(vis(d,'#gate')&&!vis(d,'.wrap'),'çıkışta içerik gizli');
}catch(e){out.push('FAIL hata: '+e.message)} document.getElementById('o').textContent=out.join('\n')};
</script>
